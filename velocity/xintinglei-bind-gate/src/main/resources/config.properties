# Internal identity-service endpoint. HTTPS is required except for loopback HTTP.
codeEndpoint=https://skin.xintinglei.cn/api/xintinglei/floodgate/link-codes

# Sent as: Authorization: Bearer <token>. Set a long random secret before production.
bearerToken=

# Maximum synchronous wait in the Floodgate handshake. Keep it small.
timeoutMillis=3000

# Fallback URL displayed if the service response omits "url".
linkUrl=https://skin.xintinglei.cn/user/bedrock-link
